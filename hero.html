<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Jay Harwani — hero reference</title>

<!--
  STANDALONE REFERENCE for the hero.

  GENERATED. The GLSL and every constant below are extracted from
  src/components/home/scene/Anatomy.tsx, so the two cannot drift. After
  tuning the component, regenerate:

      node scripts/build-hero-html.mjs

  It uses ES modules, so serve it rather than opening the file directly:
      npm run dev   →   http://localhost:3000/hero.html

  TUNE, in order of effect:
    C.COUNT    how many frames. Density is the whole mood
    ACCENTS    the four project colours - the only colour in the section
    C.BLOOM    bloom strength. Past ~0.4 it reads as a mistake, not light
-->

<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #0B0D10; color: #F4F1EA;
    font-family: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  .entry { position: relative; min-height: 100svh; display: flex; overflow: hidden; }
  .field { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
  .field canvas { display: block; width: 100%; height: 100%; }
  .stage {
    position: relative; z-index: 2; flex: 1 1 auto;
    display: flex; align-items: center; justify-content: center;
    padding: clamp(24px, 6vw, 80px);
  }
  .plate { text-align: center; will-change: transform; }
  .welcome, .name {
    opacity: 0; transform: translateY(16px);
    transition: opacity 900ms cubic-bezier(.16,1,.3,1),
                transform 1100ms cubic-bezier(.16,1,.3,1);
  }
  /* kinetic type: Geist is variable (wght 400..600), so the name arrives
     light and wide and settles into weight and tracking with the assembly */
  .name {
    font-variation-settings: "wght" 400; letter-spacing: .02em;
    transition: opacity 1000ms cubic-bezier(.16,1,.3,1) 90ms,
                transform 1200ms cubic-bezier(.16,1,.3,1) 90ms,
                font-variation-settings 1400ms cubic-bezier(.16,1,.3,1) 180ms,
                letter-spacing 1400ms cubic-bezier(.16,1,.3,1) 180ms;
  }
  .is-in .name { font-variation-settings: "wght" 500; letter-spacing: -.042em; }
  .is-in .welcome, .is-in .name { opacity: 1; transform: none; }
  .is-instant .welcome, .is-instant .name, .is-instant .cue { transition: none; }
  .welcome {
    margin: 0 0 clamp(18px, 2.6vh, 30px);
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: .75rem; letter-spacing: .34em; text-transform: uppercase; color: #9AA2AE;
  }
  .name {
    margin: 0; font-size: clamp(3rem, 12.5vw, 11.5rem); font-weight: 500;
    line-height: .92; color: #F4F1EA; white-space: nowrap;
  }
  .cue {
    position: absolute; z-index: 4; left: 0; right: 0; bottom: clamp(22px, 4vh, 44px);
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    pointer-events: none; opacity: 0; transition: opacity 900ms ease 700ms;
  }
  .is-in .cue { opacity: 1; }
  .cue span {
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: .75rem; letter-spacing: .28em; text-transform: uppercase; color: #9AA2AE;
  }
  .arrow {
    position: relative; width: 1px; height: 46px; overflow: hidden;
    background: rgba(242,241,236,.16);
  }
  .arrow::after {
    content: ""; position: absolute; inset: 0 auto auto 0; width: 1px; height: 16px;
    background: #F2F1EC; animation: fall 2.4s cubic-bezier(.5,0,.5,1) infinite;
  }
  @keyframes fall {
    0% { transform: translateY(-18px); opacity: 0; }
    30%, 70% { opacity: 1; }
    100% { transform: translateY(46px); opacity: 0; }
  }
  @media (max-width: 900px) {
    .welcome { letter-spacing: .22em; font-size: 10px; }
    .name { font-size: clamp(2.7rem, 14vw, 11.5rem); }
  }
  @media (prefers-reduced-motion: reduce) {
    .welcome, .name, .cue { transition: none; }
    .arrow::after { animation: none; opacity: .6; transform: translateY(14px); }
  }
</style>
</head>
<body>

<section class="entry" id="entry" aria-label="Welcome">
  <div class="field" id="field" aria-hidden="true"></div>
  <div class="stage">
    <div class="plate" id="plate">
      <p class="welcome">Welcome to my portfolio</p>
      <h1 class="name">Jay Harwani</h1>
    </div>
  </div>
  <div class="near" id="near" aria-hidden="true"></div>
  <div class="cue">
    <span>Scroll</span>
    <span class="arrow" aria-hidden="true"></span>
  </div>
</section>

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const C = {
  "COUNT": 20,
  "COUNT_SMALL": 14,
  "Z_NEAR": 1.1,
  "Z_FAR": -15,
  "CAMERA_Z": 6,
  "FOV": 42,
  "OVERFILL": 1.22,
  "GRID": 7,
  "JITTER": 0.46,
  "CLEAR_BAND": 0.34,
  "SIZE_MIN": 0.5,
  "SIZE_MAX": 1.5,
  "PARALLAX": 0.78,
  "EASE": 0.045,
  "DRIFT": 0.09,
  "BLOOM": 0.2,
  "BLOOM_RADIUS": 0.8,
  "BLOOM_THRESHOLD": 0.42,
  "EXPOSURE": 1.15,
  "ABERRATION": 0.09,
  "GRAIN": 0.022,
  "VIGNETTE": 0.55,
  "INTRO_MS": 2200,
  "SCATTER_Z": 26,
  "SCATTER_XY": 3.4,
  "RENDER_SCALE": 1,
  "RENDER_SCALE_SMALL": 0.8
};
const ACCENTS = ["#1F9D55", "#34D399", "#A78BFA", "#14B8A6"];
const HAIR = '#F2F1EC', BG = '#0B0D10';

const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const COARSE = matchMedia('(pointer: coarse)').matches;
const SMALL  = matchMedia('(max-width: 760px)').matches;

const VERT = `
  attribute vec3 aStart;
  attribute vec3 aColor;
  attribute float aPhase;
  attribute float aWeight;

  uniform float uTime;
  uniform float uAssemble;
  uniform float uFade;
  uniform float uNear;
  uniform float uFar;

  varying vec3 vColor;
  varying float vAlpha;

  void main() {
    /* THE ENTRANCE, in one line. Each vertex knows where it started and
       where it belongs; uAssemble is the only thing that moves. */
    vec3 p = mix(aStart, position, uAssemble);

    /* a slow individual drift once assembled, so the composition breathes
       without anything looping visibly. Per-vertex phase, so neighbouring
       frames never move together. */
    float live = uAssemble * uAssemble;
    p.y += sin(uTime * 0.23 + aPhase) * 0.042 * live;
    p.x += cos(uTime * 0.17 + aPhase * 1.7) * 0.034 * live;

    vec4 mv = modelViewMatrix * vec4(p, 1.0);
    float d = max(-mv.z, 0.001);
    gl_Position = projectionMatrix * mv;

    vColor = aColor;
    /* atmospheric perspective: the back of the stack fades toward the page
       colour rather than staying crisp and small */
    float depth = clamp((uFar - d) / (uFar - uNear), 0.0, 1.0);
    vAlpha = uFade * aWeight * (0.12 + 0.88 * depth * depth);
  }`;
const FRAG = `
  precision mediump float;
  varying vec3 vColor;
  varying float vAlpha;
  void main() {
    gl_FragColor = vec4(vColor, vAlpha);
  }`;
const FinishShader = {
  uniforms: {
    tDiffuse: { value: null },
    uRes: { value: new THREE.Vector2(1, 1) },
    uTime: { value: 0 },
    uAberration: { value: C.ABERRATION },
    uGrain: { value: C.GRAIN },
    uVignette: { value: C.VIGNETTE }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform vec2 uRes;
    uniform float uTime;
    uniform float uAberration;
    uniform float uGrain;
    uniform float uVignette;
    varying vec2 vUv;

    float hash(vec2 p) {
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
    }

    void main() {
      vec2 c = vUv - 0.5;
      float r2 = dot(c, c);
      /* scaled by r², so the fringing lives at the edges of the frame the way
         it does in a real lens and never touches the type in the middle */
      vec2 off = c * r2 * uAberration * 0.06;
      vec3 col;
      col.r = texture2D(tDiffuse, vUv + off).r;
      col.g = texture2D(tDiffuse, vUv).g;
      col.b = texture2D(tDiffuse, vUv - off).b;

      float g = hash(vUv * uRes + fract(uTime * 11.0)) - 0.5;
      col += g * uGrain;
      col *= 1.0 - uVignette * r2 * 1.5;
      gl_FragColor = vec4(col, 1.0);
    }`
};

function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = a + 1831565813 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function build(count, aspect, seed) {
  const rand = rng(seed);
  const pos = [];
  const start = [];
  const col = [];
  const phase = [];
  const weight = [];
  const tan = Math.tan(C.FOV / 2 * Math.PI / 180);
  const hair = new THREE.Color(HAIR);
  const accents = ACCENTS.map((a) => new THREE.Color(a));
  const seg = (ax, ay, bx, by, z, c, w, ph) => {
    pos.push(ax, ay, z, bx, by, z);
    const sz = z - C.SCATTER_Z * (0.35 + rand() * 0.65);
    const sx = (rand() * 2 - 1) * C.SCATTER_XY;
    const sy = (rand() * 2 - 1) * C.SCATTER_XY;
    start.push(ax + sx, ay + sy, sz, bx + sx, by + sy, sz);
    for (let k = 0; k < 2; k++) {
      col.push(c.r, c.g, c.b);
      phase.push(ph);
      weight.push(w);
    }
  };
  for (let i = 0; i < count; i++) {
    const t = Math.pow(rand(), 0.7);
    const z = C.Z_NEAR + (C.Z_FAR - C.Z_NEAR) * t;
    const d = C.CAMERA_Z - z;
    const halfH = tan * d * C.OVERFILL;
    const halfW = halfH * aspect;
    const gx = Math.floor(rand() * C.GRID);
    const gy = Math.floor(rand() * C.GRID);
    const cx = (gx + 0.5) / C.GRID * 2 - 1 + (rand() * 2 - 1) * (C.JITTER / C.GRID) * 2;
    let cy = (gy + 0.5) / C.GRID * 2 - 1 + (rand() * 2 - 1) * (C.JITTER / C.GRID) * 2;
    const scale = (C.SIZE_MIN + rand() * (C.SIZE_MAX - C.SIZE_MIN)) * (d / C.CAMERA_Z);
    const big = scale > (C.SIZE_MIN + C.SIZE_MAX) * 0.5 * (d / C.CAMERA_Z);
    if (big && Math.abs(cy) < C.CLEAR_BAND) {
      cy = (cy < 0 ? -1 : 1) * (C.CLEAR_BAND + rand() * (1 - C.CLEAR_BAND));
    }
    const x = cx * halfW;
    const y = cy * halfH;
    const ratios = [1.6, 1.33, 1, 0.75];
    const ratio = ratios[Math.floor(rand() * ratios.length)];
    const w = scale * ratio;
    const h = scale;
    const ph = rand() * 6.283;
    const l = x - w / 2;
    const r = x + w / 2;
    const b = y - h / 2;
    const tp = y + h / 2;
    seg(l, tp, r, tp, z, hair, 0.55, ph);
    seg(r, tp, r, b, z, hair, 0.55, ph);
    seg(r, b, l, b, z, hair, 0.55, ph);
    seg(l, b, l, tp, z, hair, 0.55, ph);
    const hy = tp - h * 0.19;
    seg(l, hy, r, hy, z, hair, 0.34, ph);
    const rows = 2 + Math.floor(rand() * 2);
    for (let k = 0; k < rows; k++) {
      const ry = hy - h * (0.16 + k * 0.15);
      const rw = w * (0.3 + rand() * 0.45);
      seg(l + w * 0.09, ry, l + w * 0.09 + rw, ry, z, hair, 0.26, ph);
    }
    if (rand() < 0.34) {
      const a = accents[Math.floor(rand() * accents.length)];
      const by2 = tp - h * 0.095;
      seg(l + w * 0.09, by2, l + w * 0.09 + w * 0.22, by2, z, a, 1, ph);
    }
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  geometry.setAttribute("aStart", new THREE.Float32BufferAttribute(start, 3));
  geometry.setAttribute("aColor", new THREE.Float32BufferAttribute(col, 3));
  geometry.setAttribute("aPhase", new THREE.Float32BufferAttribute(phase, 1));
  geometry.setAttribute("aWeight", new THREE.Float32BufferAttribute(weight, 1));
  return { geometry };
}

const scale = SMALL ? C.RENDER_SCALE_SMALL : C.RENDER_SCALE;
const pr = Math.min(devicePixelRatio, 2) * scale;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(pr);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = C.EXPOSURE;
document.getElementById('field').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);
const camera = new THREE.PerspectiveCamera(C.FOV, innerWidth / innerHeight, 0.1, 120);
camera.position.set(0, 0, C.CAMERA_Z);

const { geometry } = build(SMALL ? C.COUNT_SMALL : C.COUNT, innerWidth / innerHeight, 11);

const uniforms = {
  uTime: { value: 0 },
  uAssemble: { value: REDUCE ? 1 : 0 },
  uFade: { value: REDUCE ? 1 : 0 },
  uNear: { value: C.CAMERA_Z - C.Z_NEAR },
  uFar: { value: C.CAMERA_Z - C.Z_FAR }
};
const material = new THREE.ShaderMaterial({
  uniforms, vertexShader: VERT, fragmentShader: FRAG,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
});
const lines = new THREE.LineSegments(geometry, material);
lines.frustumCulled = false;
scene.add(lines);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight),
  REDUCE ? C.BLOOM : 0, C.BLOOM_RADIUS, C.BLOOM_THRESHOLD);
composer.addPass(bloom);
const finish = new ShaderPass(FinishShader);
composer.addPass(finish);
composer.addPass(new OutputPass());

function size() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloom.setSize(innerWidth * pr, innerHeight * pr);
  finish.uniforms.uRes.value.set(innerWidth * pr, innerHeight * pr);
}
size();

let tx = 0, ty = 0, ex = 0, ey = 0;
if (!REDUCE && !COARSE) {
  addEventListener('pointermove', (e) => {
    tx = (e.clientX / innerWidth) * 2 - 1;
    ty = (e.clientY / innerHeight) * 2 - 1;
  }, { passive: true });
}

let resizeQueued = false;
addEventListener('resize', () => {
  if (resizeQueued) return;
  resizeQueued = true;
  requestAnimationFrame(() => { resizeQueued = false; size(); });
});

const entry = document.getElementById('entry');
const plate = document.getElementById('plate');
const near = document.getElementById('near');

if (REDUCE) {
  uniforms.uTime.value = 11; finish.uniforms.uTime.value = 11;
  camera.position.set(0.22, -0.1, C.CAMERA_Z);
  camera.lookAt(0, 0, 0);
  composer.render();
  entry.className += ' is-in is-instant';
} else {
  requestAnimationFrame(() => { entry.className += ' is-in'; });
  let painted = false;
  /* A document that mounts hidden produces no animation frames, so uAssemble
     would never leave zero and the hero would be an empty rectangle.
     setTimeout is not rAF-driven, which is the entire point. */
  setTimeout(() => {
    if (painted) return;
    if (entry.className.indexOf('is-in') < 0) entry.className += ' is-in';
    entry.className += ' is-instant';
    uniforms.uAssemble.value = 1; uniforms.uFade.value = 1;
    uniforms.uTime.value = 11; finish.uniforms.uTime.value = 11;
    bloom.strength = C.BLOOM;
    camera.position.set(0.22, -0.1, C.CAMERA_Z);
    camera.lookAt(0, 0, 0);
    composer.render();
  }, 2500);

  const t0 = performance.now();
  const frame = (now) => {
    requestAnimationFrame(frame);
    painted = true;
    const t = (now - t0) / 1000;

    const p = Math.min(1, (now - t0) / C.INTRO_MS);
    const e = 1 - Math.pow(1 - p, 4);
    uniforms.uAssemble.value = e;
    uniforms.uFade.value = Math.min(1, p * 1.6);
    bloom.strength = C.BLOOM * e;
    uniforms.uTime.value = t;
    finish.uniforms.uTime.value = t;

    const driftX = Math.sin(t * 0.13) * C.DRIFT;
    const driftY = Math.sin(t * 0.097 + 1.2) * C.DRIFT * 0.6;
    ex += (tx - ex) * C.EASE;
    ey += (ty - ey) * C.EASE;
    camera.position.set(ex * C.PARALLAX + driftX, -ey * C.PARALLAX * 0.62 + driftY, C.CAMERA_Z);
    camera.lookAt(0, 0, 0);

    /* the name leans against the camera; the near frame travels further,
       because it is nearer. That ratio is the depth. */
    plate.style.transform = 'translate3d(' +
      (-ex * 14).toFixed(2) + 'px,' + (-ey * 9).toFixed(2) + 'px,0)';
    near.style.transform = 'translate3d(' +
      (-ex * 46).toFixed(2) + 'px,' + (-ey * 30).toFixed(2) + 'px,0)';

    composer.render();
  };
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
