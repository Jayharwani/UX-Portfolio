<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Jay Harwani — hero reference</title>

<!--
  STANDALONE REFERENCE for the hero.

  GENERATED. The GLSL and every constant below are extracted from
  src/components/home/scene/MetalForm.tsx, so the two cannot drift. After
  tuning the component, regenerate:

      node scripts/build-hero-html.mjs

  It uses ES modules, so serve it rather than opening the file directly:
      npm run dev   →   http://localhost:3000/hero.html

  TUNE, in order of effect:
    C.ROUGHNESS  how polished. 0.12 is wet mercury, 0.35 is brushed
    MATERIAL     colour and iridescence. This IS the art direction
    C.BLOOM      bloom strength. Past ~0.5 it reads as a mistake, not light
-->

<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #0B0D10; color: #F4F1EA;
    font-family: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  .entry { position: relative; min-height: 100svh; display: flex; overflow: hidden; }
  .field { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
  .field canvas { display: block; width: 100%; height: 100%; }
  .stage {
    position: relative; z-index: 2; flex: 1 1 auto;
    display: flex; align-items: center; justify-content: center;
    padding: clamp(24px, 6vw, 80px);
  }
  .plate { text-align: center; will-change: transform; }
  .welcome, .name {
    opacity: 0; transform: translateY(16px);
    transition: opacity 900ms cubic-bezier(.16,1,.3,1),
                transform 1100ms cubic-bezier(.16,1,.3,1);
  }
  .name { transition-delay: 90ms; }
  .is-in .welcome, .is-in .name { opacity: 1; transform: none; }
  .is-instant .welcome, .is-instant .name, .is-instant .cue { transition: none; }
  .welcome {
    margin: 0 0 clamp(18px, 2.6vh, 30px);
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: .75rem; letter-spacing: .34em; text-transform: uppercase; color: #9AA2AE;
  }
  .name {
    margin: 0; font-size: clamp(3rem, 12.5vw, 11.5rem); font-weight: 500;
    line-height: .92; letter-spacing: -.042em; color: #F4F1EA; white-space: nowrap;
  }
  .cue {
    position: absolute; z-index: 4; left: 0; right: 0; bottom: clamp(22px, 4vh, 44px);
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    pointer-events: none; opacity: 0; transition: opacity 900ms ease 700ms;
  }
  .is-in .cue { opacity: 1; }
  .cue span {
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: .75rem; letter-spacing: .28em; text-transform: uppercase; color: #9AA2AE;
  }
  .arrow {
    position: relative; width: 1px; height: 46px; overflow: hidden;
    background: rgba(242,241,236,.16);
  }
  .arrow::after {
    content: ""; position: absolute; inset: 0 auto auto 0; width: 1px; height: 16px;
    background: #F2F1EC; animation: fall 2.4s cubic-bezier(.5,0,.5,1) infinite;
  }
  @keyframes fall {
    0% { transform: translateY(-18px); opacity: 0; }
    30%, 70% { opacity: 1; }
    100% { transform: translateY(46px); opacity: 0; }
  }
  @media (max-width: 900px) {
    .welcome { letter-spacing: .22em; font-size: 10px; }
    .name { font-size: clamp(2.7rem, 14vw, 11.5rem); }
  }
  @media (prefers-reduced-motion: reduce) {
    .welcome, .name, .cue { transition: none; }
    .arrow::after { animation: none; opacity: .6; transform: translateY(14px); }
  }
</style>
</head>
<body>

<section class="entry" id="entry" aria-label="Welcome">
  <div class="field" id="field" aria-hidden="true"></div>
  <div class="stage">
    <div class="plate" id="plate">
      <p class="welcome">Welcome to my portfolio</p>
      <h1 class="name">Jay Harwani</h1>
    </div>
  </div>
  <div class="cue">
    <span>Scroll</span>
    <span class="arrow" aria-hidden="true"></span>
  </div>
</section>

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const C = {
  "FOV": 38,
  "FILL": 0.75,
  "FILL_PORTRAIT": 0.66,
  "LIFT_F": 0.25,
  "DETAIL": 6,
  "DETAIL_SMALL": 4,
  "RADIUS": 1.02,
  "AMP": 0.13,
  "FREQ": 0.95,
  "MORPH": 0.16,
  "NORMAL_EPS": 0.03,
  "ROUGHNESS": 0.22,
  "CLEARCOAT": 1,
  "CLEARCOAT_ROUGHNESS": 0.12,
  "IRIDESCENCE": 0.9,
  "IRIDESCENCE_IOR": 1.36,
  "IRIDESCENCE_MIN": 140,
  "IRIDESCENCE_MAX": 430,
  "PARALLAX": 0.62,
  "EASE": 0.045,
  "BLOOM": 0.3,
  "BLOOM_RADIUS": 0.75,
  "BLOOM_THRESHOLD": 0.72,
  "EXPOSURE": 0.88,
  "ABERRATION": 0.2,
  "GRAIN": 0.02,
  "VIGNETTE": 0.62,
  "INTRO_MS": 2000,
  "INTRO_DOLLY": 0.68,
  "RENDER_SCALE": 1,
  "RENDER_SCALE_SMALL": 0.72
};
const MATERIAL = { color: '#0E141C', metalness: 1.0 };
const KEY = '#FFE3C6', RIM = '#7FD4F0', BG = '#0B0D10';

const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const COARSE = matchMedia('(pointer: coarse)').matches;
const SMALL  = matchMedia('(max-width: 760px)').matches;

const DISPLACE_GLSL = `
  uniform float uTime;
  uniform float uAmp;
  uniform float uFreq;
  uniform float uEps;

  vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
  vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
  vec4 permute(vec4 x) { return mod289(((x * 34.0) + 1.0) * x); }
  vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

  float snoise(vec3 v) {
    const vec2 C2 = vec2(1.0 / 6.0, 1.0 / 3.0);
    const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
    vec3 i  = floor(v + dot(v, C2.yyy));
    vec3 x0 = v - i + dot(i, C2.xxx);
    vec3 g = step(x0.yzx, x0.xyz);
    vec3 l = 1.0 - g;
    vec3 i1 = min(g.xyz, l.zxy);
    vec3 i2 = max(g.xyz, l.zxy);
    vec3 x1 = x0 - i1 + C2.xxx;
    vec3 x2 = x0 - i2 + C2.yyy;
    vec3 x3 = x0 - D.yyy;
    i = mod289(i);
    vec4 p = permute(permute(permute(
               i.z + vec4(0.0, i1.z, i2.z, 1.0))
             + i.y + vec4(0.0, i1.y, i2.y, 1.0))
             + i.x + vec4(0.0, i1.x, i2.x, 1.0));
    float n_ = 0.142857142857;
    vec3 ns = n_ * D.wyz - D.xzx;
    vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
    vec4 x_ = floor(j * ns.z);
    vec4 y_ = floor(j - 7.0 * x_);
    vec4 x = x_ * ns.x + ns.yyyy;
    vec4 y = y_ * ns.x + ns.yyyy;
    vec4 h = 1.0 - abs(x) - abs(y);
    vec4 b0 = vec4(x.xy, y.xy);
    vec4 b1 = vec4(x.zw, y.zw);
    vec4 s0 = floor(b0) * 2.0 + 1.0;
    vec4 s1 = floor(b1) * 2.0 + 1.0;
    vec4 sh = -step(h, vec4(0.0));
    vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
    vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;
    vec3 p0 = vec3(a0.xy, h.x);
    vec3 p1 = vec3(a0.zw, h.y);
    vec3 p2 = vec3(a1.xy, h.z);
    vec3 p3 = vec3(a1.zw, h.w);
    vec4 norm = taylorInvSqrt(vec4(dot(p0, p0), dot(p1, p1), dot(p2, p2), dot(p3, p3)));
    p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
    vec4 m = max(0.6 - vec4(dot(x0, x0), dot(x1, x1), dot(x2, x2), dot(x3, x3)), 0.0);
    m = m * m;
    return 42.0 * dot(m * m, vec4(dot(p0, x0), dot(p1, x1), dot(p2, x2), dot(p3, x3)));
  }

  /* Three octaves, and one much larger slow fold on top. The fold is what
     changes the SILHOUETTE over time; octaves alone only ripple the surface,
     and a form whose outline never changes stops being interesting in about
     four seconds. */
  float shape(vec3 p) {
    vec3 q = p * uFreq + vec3(0.0, 0.0, uTime);
    float n = snoise(q) * 0.55;
    n += snoise(q * 2.07) * 0.18;
    n += snoise(q * 4.13) * 0.06;
    n += snoise(p * uFreq * 0.42 + vec3(uTime * 0.55, 0.0, 0.0)) * 0.42;
    return n;
  }

  vec3 displaced(vec3 p) { return p * (1.0 + shape(p) * uAmp); }

  vec3 gPos;
`;
const NORMAL_GLSL = `
  gPos = displaced(position);

  /* a stable tangent basis — a fixed 'up' degenerates at the poles, so swap
     axes when the normal gets close to one */
  vec3 up = abs(normal.y) < 0.99 ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0);
  vec3 t1 = normalize(cross(up, normal));
  vec3 t2 = cross(normal, t1);

  /* the neighbours are renormalised back onto the sphere before being
     displaced, so both samples come from the same surface */
  vec3 n1 = displaced(normalize(position + t1 * uEps) * %R%);
  vec3 n2 = displaced(normalize(position + t2 * uEps) * %R%);
  vec3 objectNormal = normalize(cross(n1 - gPos, n2 - gPos));
  if (dot(objectNormal, normal) < 0.0) objectNormal = -objectNormal;`;

const FinishShader = {
  uniforms: {
    tDiffuse: { value: null },
    uRes: { value: new THREE.Vector2(1, 1) },
    uTime: { value: 0 },
    uAberration: { value: C.ABERRATION },
    uGrain: { value: C.GRAIN },
    uVignette: { value: C.VIGNETTE }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform vec2 uRes;
    uniform float uTime;
    uniform float uAberration;
    uniform float uGrain;
    uniform float uVignette;
    varying vec2 vUv;

    float hash(vec2 p) {
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
    }

    void main() {
      vec2 c = vUv - 0.5;
      float r2 = dot(c, c);
      /* scaled by r², so the fringing lives at the edges of the frame the way
         it does in a real lens and never touches the type in the middle */
      vec2 off = c * r2 * uAberration * 0.06;
      vec3 col;
      col.r = texture2D(tDiffuse, vUv + off).r;
      col.g = texture2D(tDiffuse, vUv).g;
      col.b = texture2D(tDiffuse, vUv - off).b;

      /* grain moves; static grain reads as a dirty screen */
      float g = hash(vUv * uRes + fract(uTime * 11.0)) - 0.5;
      col += g * uGrain;

      col *= 1.0 - uVignette * r2 * 1.5;
      gl_FragColor = vec4(col, 1.0);
    }`
};

const scale = SMALL ? C.RENDER_SCALE_SMALL : C.RENDER_SCALE;
const pr = Math.min(devicePixelRatio, 2) * scale;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(pr);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = C.EXPOSURE;
document.getElementById('field').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);

const camera = new THREE.PerspectiveCamera(C.FOV, innerWidth / innerHeight, 0.1, 80);
const halfHPerUnit = Math.tan((C.FOV / 2) * Math.PI / 180);
const extent = C.RADIUS * (1 + C.AMP);
let restDist = C.RADIUS * 4;
function fit() {
  const aspect = camera.aspect;
  const half = Math.min(halfHPerUnit, halfHPerUnit * aspect);
  const fill = aspect < 1 ? C.FILL_PORTRAIT : C.FILL;
  restDist = extent / (half * fill);
}
camera.position.set(0, 0, restDist);

/* image-based lighting, built rather than downloaded */
const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
const roomScene = new RoomEnvironment();
const envRT = pmrem.fromScene(roomScene, 0.035);
scene.environment = envRT.texture;
roomScene.traverse((o) => {
  if (o.isMesh) { o.geometry.dispose(); o.material.dispose(); }
});
pmrem.dispose();

const key = new THREE.DirectionalLight(new THREE.Color(KEY), 0.42);
key.position.set(-2.6, 3.0, 2.4);
scene.add(key);
const rim = new THREE.DirectionalLight(new THREE.Color(RIM), 1.15);
rim.position.set(2.8, -1.4, -2.2);
scene.add(rim);

const geo = new THREE.IcosahedronGeometry(C.RADIUS, SMALL ? C.DETAIL_SMALL : C.DETAIL);
const mat = new THREE.MeshPhysicalMaterial({
  color: new THREE.Color(MATERIAL.color),
  metalness: MATERIAL.metalness,
  roughness: C.ROUGHNESS,
  clearcoat: C.CLEARCOAT,
  clearcoatRoughness: C.CLEARCOAT_ROUGHNESS,
  iridescence: C.IRIDESCENCE,
  iridescenceIOR: C.IRIDESCENCE_IOR,
  iridescenceThicknessRange: [C.IRIDESCENCE_MIN, C.IRIDESCENCE_MAX],
  envMapIntensity: 0.32
});

const uTime = { value: 0 }, uAmp = { value: 0 };
const uFreq = { value: C.FREQ }, uEps = { value: C.NORMAL_EPS };

mat.onBeforeCompile = (shader) => {
  shader.uniforms.uTime = uTime;
  shader.uniforms.uAmp = uAmp;
  shader.uniforms.uFreq = uFreq;
  shader.uniforms.uEps = uEps;
  shader.vertexShader = DISPLACE_GLSL + shader.vertexShader;
  shader.vertexShader = shader.vertexShader.replace(
    '#include <beginnormal_vertex>',
    NORMAL_GLSL.replaceAll('%R%', C.RADIUS.toFixed(3))
  );
  shader.vertexShader = shader.vertexShader.replace(
    '#include <begin_vertex>',
    'vec3 transformed = gPos;'
  );
};

const mesh = new THREE.Mesh(geo, mat);
scene.add(mesh);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight),
  REDUCE ? C.BLOOM : 0, C.BLOOM_RADIUS, C.BLOOM_THRESHOLD);
composer.addPass(bloom);
const finish = new ShaderPass(FinishShader);
composer.addPass(finish);
composer.addPass(new OutputPass());

function size() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  fit();
  mesh.position.y = C.LIFT_F * halfHPerUnit * restDist;
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloom.setSize(innerWidth * pr, innerHeight * pr);
  finish.uniforms.uRes.value.set(innerWidth * pr, innerHeight * pr);
}
size();

let tx = 0, ty = 0, ex = 0, ey = 0;
if (!REDUCE && !COARSE) {
  addEventListener('pointermove', (e) => {
    tx = (e.clientX / innerWidth) * 2 - 1;
    ty = (e.clientY / innerHeight) * 2 - 1;
  }, { passive: true });
}

let resizeQueued = false;
addEventListener('resize', () => {
  if (resizeQueued) return;
  resizeQueued = true;
  requestAnimationFrame(() => { resizeQueued = false; size(); });
});

const entry = document.getElementById('entry');
const plate = document.getElementById('plate');

if (REDUCE) {
  uTime.value = 6.2; uAmp.value = C.AMP; finish.uniforms.uTime.value = 6.2;
  mesh.rotation.set(0.24, -0.5, 0.08);
  composer.render();
  entry.className += ' is-in is-instant';
} else {
  requestAnimationFrame(() => { entry.className += ' is-in'; });
  let painted = false;
  /* A document that mounts hidden produces no animation frames, so nothing
     above would ever run and the hero would be a dark sphere. setTimeout is
     not rAF-driven, which is the entire point. */
  setTimeout(() => {
    if (painted) return;
    if (entry.className.indexOf('is-in') < 0) entry.className += ' is-in';
    entry.className += ' is-instant';
    uTime.value = 6.2; uAmp.value = C.AMP; finish.uniforms.uTime.value = 6.2;
    mesh.rotation.set(0.24, -0.5, 0.08);
    bloom.strength = C.BLOOM;
    composer.render();
  }, 2500);

  const t0 = performance.now();
  let last = t0, spin = 0;
  const frame = (now) => {
    requestAnimationFrame(frame);
    painted = true;
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    const t = (now - t0) / 1000;

    const p = Math.min(1, (now - t0) / C.INTRO_MS);
    const e = 1 - Math.pow(1 - p, 3);
    uAmp.value = C.AMP * e;
    bloom.strength = C.BLOOM * e;
    uTime.value = t * C.MORPH;
    finish.uniforms.uTime.value = t;

    spin += dt * (0.055 + 0.028 * Math.sin(t * 0.07));
    mesh.rotation.y = spin;
    mesh.rotation.x = Math.sin(t * 0.13) * 0.18;
    mesh.rotation.z = Math.sin(t * 0.09 + 1.1) * 0.1;

    ex += (tx - ex) * C.EASE;
    ey += (ty - ey) * C.EASE;
    const dolly = restDist * (C.INTRO_DOLLY + (1 - C.INTRO_DOLLY) * e);
    camera.position.set(ex * C.PARALLAX, -ey * C.PARALLAX * 0.62, dolly);
    camera.lookAt(0, mesh.position.y * 0.55, 0);

    plate.style.transform = 'translate3d(' +
      (-ex * 14).toFixed(2) + 'px,' + (-ey * 9).toFixed(2) + 'px,0)';

    composer.render();
  };
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
