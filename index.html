    <!--
      Type is self-hosted and subset to Latin, so the homepage makes no
      third-party request before LCP. Three files, 39 KB in total, built by
      scripts/fonts.sh from the geist package and committed.

      Only the display face is preloaded: it carries the H1, which is the LCP
      element. The text face swaps in behind the metric-matched fallback in
      tokens.css, and the mono face is wanted by the spec layer and the case
      studies, neither of which is above the fold.

      What left here: the Fontshare stylesheet (Clash Display, General Sans)
      and the Google one (DM Sans, Geist, Geist Mono, Instrument Serif, Inter,
      Playfair Display). Eight declared families, of which every live route
      used exactly two, Geist and Geist Mono. The Fontshare link was
      render-blocking.
    -->
    <link rel="preload" href="/fonts/Geist-SemiBold-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>

    <div id="root"></div>

  </body>
