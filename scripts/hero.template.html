<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Jay Harwani — hero reference</title>

<!--
  STANDALONE REFERENCE for the liquid-field hero.

  GENERATED. The GLSL and every constant below are extracted from
  src/components/home/scene/LiquidField.tsx, so the two cannot drift. After
  tuning the component, regenerate:

      node scripts/build-hero-html.mjs

  It uses ES modules, so serve it rather than opening the file directly:
      npm run dev   →   http://localhost:3000/hero.html
  (A file:// page cannot resolve an import map.)

  TUNE, in order of effect:
    C.SPEED    how fast the surface evolves — the biggest taste knob there is
    PALETTE    the cosine-palette coefficients. This IS the art direction
    C.BLOOM    bloom strength. Past ~0.5 it reads as a mistake, not as light
-->

<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #0B0D10; color: #F4F1EA;
    font-family: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  .entry { position: relative; min-height: 100svh; display: flex; overflow: hidden; }
  .field { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
  .field canvas { display: block; width: 100%; height: 100%; }
  .glow {
    position: absolute; z-index: 1; left: 50%; top: 50%;
    width: min(1180px, 92vw); height: min(540px, 58vh);
    transform: translate(-50%, -50%); pointer-events: none;
    background: radial-gradient(ellipse at center,
      rgba(11,13,16,0.46) 0%, rgba(11,13,16,0.24) 46%, transparent 76%);
  }
  .stage {
    position: relative; z-index: 2; flex: 1 1 auto;
    display: flex; align-items: center; justify-content: center;
    padding: clamp(24px, 6vw, 80px);
  }
  .plate { text-align: center; will-change: transform; }
  .welcome, .name {
    opacity: 0; transform: translateY(16px);
    transition: opacity 900ms cubic-bezier(.16,1,.3,1),
                transform 1100ms cubic-bezier(.16,1,.3,1);
  }
  .name { transition-delay: 90ms; }
  .is-in .welcome, .is-in .name { opacity: 1; transform: none; }
  .is-instant .welcome, .is-instant .name, .is-instant .cue { transition: none; }
  .welcome {
    margin: 0 0 clamp(18px, 2.6vh, 30px);
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: .75rem; letter-spacing: .34em; text-transform: uppercase; color: #9AA2AE;
  }
  .name {
    margin: 0; font-size: clamp(3rem, 12.5vw, 11.5rem); font-weight: 500;
    line-height: .92; letter-spacing: -.042em; color: #F4F1EA; white-space: nowrap;
  }
  .cue {
    position: absolute; z-index: 4; left: 0; right: 0; bottom: clamp(22px, 4vh, 44px);
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    pointer-events: none; opacity: 0; transition: opacity 900ms ease 700ms;
  }
  .is-in .cue { opacity: 1; }
  .cue span {
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: .75rem; letter-spacing: .28em; text-transform: uppercase; color: #9AA2AE;
  }
  .arrow {
    position: relative; width: 1px; height: 46px; overflow: hidden;
    background: rgba(242,241,236,.16);
  }
  .arrow::after {
    content: ""; position: absolute; inset: 0 auto auto 0; width: 1px; height: 16px;
    background: #F2F1EC; animation: fall 2.4s cubic-bezier(.5,0,.5,1) infinite;
  }
  @keyframes fall {
    0% { transform: translateY(-18px); opacity: 0; }
    30%, 70% { opacity: 1; }
    100% { transform: translateY(46px); opacity: 0; }
  }
  @media (max-width: 900px) {
    .welcome { letter-spacing: .22em; font-size: 10px; }
    .name { font-size: clamp(2.7rem, 14vw, 11.5rem); }
    .glow { width: 96vw; height: 44vh; }
  }
  @media (prefers-reduced-motion: reduce) {
    .welcome, .name, .cue { transition: none; }
    .arrow::after { animation: none; opacity: .6; transform: translateY(14px); }
  }
</style>
</head>
<body>

<section class="entry" id="entry" aria-label="Welcome">
  <div class="field" id="field" aria-hidden="true"></div>
  <div class="glow" aria-hidden="true"></div>
  <div class="stage">
    <div class="plate" id="plate">
      <p class="welcome">Welcome to my portfolio</p>
      <h1 class="name">Jay Harwani</h1>
    </div>
  </div>
  <div class="cue">
    <span>Scroll</span>
    <span class="arrow" aria-hidden="true"></span>
  </div>
</section>

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const C = __C__;
const PALETTE = __PAL__;
const BASE = '#0B0D10', WARM = '__WARM__', COOL = '__COOL__';

const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const COARSE = matchMedia('(pointer: coarse)').matches;
const SMALL  = matchMedia('(max-width: 760px)').matches;

const VERT = `__VERT__`;
const FIELD_FRAG = `__FIELD__`;
const FinishShader = {
  uniforms: {
    tDiffuse: { value: null },
    uRes: { value: new THREE.Vector2(1, 1) },
    uTime: { value: 0 },
    uAberration: { value: C.ABERRATION },
    uGrain: { value: C.GRAIN },
    uVignette: { value: C.VIGNETTE }
  },
  vertexShader: `__FINV__`,
  fragmentShader: `__FINF__`
};

const v3 = (hex) => { const c = new THREE.Color(hex); return new THREE.Vector3(c.r, c.g, c.b); };
const a3 = (a) => new THREE.Vector3(a[0], a[1], a[2]);

const scale = SMALL ? C.RENDER_SCALE_SMALL : C.RENDER_SCALE;
const pr = Math.min(devicePixelRatio, 2) * scale;

const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false });
renderer.setPixelRatio(pr);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = C.EXPOSURE;
document.getElementById('field').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const uniforms = {
  uRes: { value: new THREE.Vector2(1, 1) },
  uTime: { value: 0 },
  uMouse: { value: new THREE.Vector2(0.5, 0.5) },
  uSwirl: { value: 0 },
  uIntro: { value: REDUCE ? 1 : 0 },
  uBase: { value: v3(BASE) }, uWarm: { value: v3(WARM) }, uCool: { value: v3(COOL) },
  pA: { value: a3(PALETTE.a) }, pB: { value: a3(PALETTE.b) },
  pC: { value: a3(PALETTE.c) }, pD: { value: a3(PALETTE.d) },
  uScale: { value: C.SCALE }, uSpeed: { value: C.SPEED }, uWarp: { value: C.WARP },
  uBands: { value: C.BANDS }, uBump: { value: C.BUMP },
  uSpec: { value: C.SPEC }, uFres: { value: C.FRESNEL },
  uPush: { value: C.PUSH }, uRipple: { value: C.RIPPLE }
};

const geo = new THREE.PlaneGeometry(2, 2);
const mat = new THREE.ShaderMaterial({
  uniforms, vertexShader: VERT, fragmentShader: FIELD_FRAG,
  defines: { OCTAVES: SMALL ? 3 : 4 }, depthTest: false, depthWrite: false
});
const quad = new THREE.Mesh(geo, mat);
quad.frustumCulled = false;
scene.add(quad);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight),
  REDUCE ? C.BLOOM : 0, C.BLOOM_RADIUS, C.BLOOM_THRESHOLD);
composer.addPass(bloom);
const finish = new ShaderPass(FinishShader);
composer.addPass(finish);
composer.addPass(new OutputPass());

function size() {
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloom.setSize(innerWidth * pr, innerHeight * pr);
  uniforms.uRes.value.set(innerWidth * pr, innerHeight * pr);
  finish.uniforms.uRes.value.set(innerWidth * pr, innerHeight * pr);
}
size();

let tx = 0.5, ty = 0.5, px = 0.5, py = 0.5, swirl = 0;
if (!REDUCE && !COARSE) {
  addEventListener('pointermove', (e) => {
    const nx = e.clientX / innerWidth, ny = 1 - e.clientY / innerHeight;
    swirl = Math.min(1, swirl + Math.hypot(nx - tx, ny - ty) * 5.5);
    tx = nx; ty = ny;
  }, { passive: true });
}

let resizeQueued = false;
addEventListener('resize', () => {
  if (resizeQueued) return;
  resizeQueued = true;
  requestAnimationFrame(() => { resizeQueued = false; size(); });
});

const entry = document.getElementById('entry');
const plate = document.getElementById('plate');

if (REDUCE) {
  uniforms.uTime.value = 42; finish.uniforms.uTime.value = 42;
  composer.render();
  entry.className += ' is-in is-instant';
} else {
  requestAnimationFrame(() => { entry.className += ' is-in'; });
  let painted = false;
  /* A document that mounts hidden produces no animation frames, so nothing
     above would ever run and the hero would be a flat rectangle. setTimeout
     is not rAF-driven, which is the entire point. */
  setTimeout(() => {
    if (painted) return;
    if (entry.className.indexOf('is-in') < 0) entry.className += ' is-in';
    entry.className += ' is-instant';
    uniforms.uIntro.value = 1;
    uniforms.uTime.value = 42; finish.uniforms.uTime.value = 42;
    bloom.strength = C.BLOOM;
    composer.render();
  }, 2500);

  const t0 = performance.now();
  let last = t0;
  const frame = (now) => {
    requestAnimationFrame(frame);
    painted = true;
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;

    const p = Math.min(1, (now - t0) / C.INTRO_MS);
    const e = 1 - Math.pow(1 - p, 3);
    uniforms.uIntro.value = e;
    bloom.strength = C.BLOOM * e;
    uniforms.uTime.value = (now - t0) / 1000;
    finish.uniforms.uTime.value = (now - t0) / 1000;

    px += (tx - px) * C.EASE;
    py += (ty - py) * C.EASE;
    uniforms.uMouse.value.set(px, py);
    swirl *= Math.pow(0.12, dt);
    uniforms.uSwirl.value = swirl;

    plate.style.transform = 'translate3d(' +
      (-(px - 0.5) * 2 * 14).toFixed(2) + 'px,' +
      ((py - 0.5) * 2 * 9).toFixed(2) + 'px,0)';

    composer.render();
  };
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
