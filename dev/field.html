<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Field lab</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #05070C; color: #EEF1F5; }
      body { font: 11px/1.4 "Geist Mono", ui-monospace, monospace; }
      #grid { display: grid; grid-template-columns: 1fr 1fr; height: 100%; }
      .cell { position: relative; }
      .cell canvas { display: block; width: 100%; height: 100%; }
      .cap { position: absolute; left: 16px; top: 14px; letter-spacing: .12em; text-transform: uppercase; opacity: .55; }
      .num { position: absolute; left: 16px; bottom: 14px; letter-spacing: .08em; opacity: .85; }
    </style>
  </head>
  <body>
    <div id="grid">
      <div class="cell" data-shape="friction" data-accent="#3FB9A6">
        <canvas></canvas><span class="cap">01 Friction</span><span class="num">10,000 reviews &rarr; 25 that repeat</span>
      </div>
      <div class="cell" data-shape="headroom" data-accent="#5FD8A4">
        <canvas></canvas><span class="cap">02 Headroom</span><span class="num">balance &minus; committed = safe</span>
      </div>
      <div class="cell" data-shape="signal" data-accent="#5FD3D8">
        <canvas></canvas><span class="cap">03 Signal</span><span class="num">scattered sources &rarr; one map</span>
      </div>
      <div class="cell" data-shape="bumper" data-accent="#E9C58B">
        <canvas></canvas><span class="cap">04 Bumper</span><span class="num">impulse &rarr; one question</span>
      </div>
    </div>
    <script type="module" src="./field.ts"></script>
  </body>
</html>
